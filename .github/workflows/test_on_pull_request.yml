name: Nosetests lvl2

# Self-hosted CLASS runner is offline (AWS suspended 2026-08-27).
# Jobs skip unless repo variable CLASS_SELF_HOSTED is the string true.
# Docs-only PRs do not start this workflow (no CLASS make, no plot upload).
on:
  pull_request:
    paths:
      - 'source/**'
      - 'include/**'
      - 'python/**'
      - 'cpp/**'
      - 'Makefile'
      - 'makefile'
      - 'explanatory.ini'
      - 'hyrec/**'
      - 'external/**'
      - 'tools/**'
      - '.github/workflows/test_on_pull_request.yml'

jobs:
  nose_tests_lvl2:
    if: ${{ vars.CLASS_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted]

    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v4
      with:
        path: main_class
    - name: Checkout reference 🛎
      uses: actions/checkout@v4
      with:
        ref: devel
        path: ref_class
    - name: Create or update virtual Python environment
      run: |
        rm -f venv/bin/python
        virtualenv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install numpy scipy pandas matplotlib cython nose parameterized
        deactivate
    - name: make classy
      run: source venv/bin/activate && cd main_class && make -j && deactivate
    - name: make reference classy
      run: |
        source venv/bin/activate
        cd ref_class
        sed -i.bak "s/'classy'/'classyref'/g" python/setup.py
        sed -i.bak 's/"classy"/"classyref"/g' python/setup.py
        make -j
        deactivate
    - name: Testing 🤖
      run: |
        source venv/bin/activate
        cd main_class/python
        OMP_NUM_THREADS=16 COMPARE_OUTPUT_REF=1 TEST_LEVEL=3 nosetests -v -a test_scenario test_class.py --nologcapture --nocapture
        deactivate
    - name: Upload plots 📤
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
          name: BranchVsMasterPlots
          path: main_class/python/faulty_figs
