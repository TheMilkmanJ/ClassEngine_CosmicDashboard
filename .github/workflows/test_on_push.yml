name: Build and light test

# Self-hosted CLASS runner is offline (AWS suspended 2026-08-27).
# Jobs skip unless repo variable CLASS_SELF_HOSTED is the string true.
# Markdown/docs-only pushes do not start this workflow.
on:
  push:
    paths:
      - 'source/**'
      - 'include/**'
      - 'python/**'
      - 'cpp/**'
      - 'Makefile'
      - 'makefile'
      - 'explanatory.ini'
      - 'hyrec/**'
      - 'external/**'
      - 'tools/**'
      - '.github/workflows/test_on_push.yml'

jobs:
  build:
    if: ${{ vars.CLASS_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted]

    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v4
      with:
        path: main_class
    - name: make
      run: cd main_class && make -j class
    - name: run class
      run: cd main_class && ./class explanatory.ini

  nose_tests_lvl1:
    if: ${{ vars.CLASS_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted]

    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v4
      with:
        path: main_class
    - name: Create or update virtual Python environment
      run: |
        rm -f venv/bin/python
        virtualenv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install numpy scipy pandas matplotlib cython nose parameterized
        deactivate
    - name: make classy
      run: source venv/bin/activate && cd main_class && make -j && deactivate
    - name: Testing 🤖
      run: |
        source venv/bin/activate
        cd main_class/python
        OMP_NUM_THREADS=16 TEST_LEVEL=1 python "$(which nosetests)" -v -a test_scenario test_class.py --nologcapture --nocapture
        deactivate
